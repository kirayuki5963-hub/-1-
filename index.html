<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ドン計算機</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  touch-action: none;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  color: #111;
  user-select: none;
}

.app {
  max-width: 430px;
  margin: auto;
  padding: 22px;
  touch-action: manipulation;
}

h1 {
  text-align: center;
  font-size: 28px;
}

input {
  width: 100%;
  box-sizing: border-box;
  font-size: 30px;
  padding: 14px;
  text-align: center;
  border: 2px solid #007aff;
  border-radius: 12px;
  user-select: text;
  touch-action: auto;
}

.result {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  margin-top: 18px;
}

.rate {
  text-align: center;
  color: #777;
  margin: 8px 0 18px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  font-size: 18px;
  font-weight: bold;
  padding: 14px 4px;
  border: 0;
  border-radius: 12px;
  color: white;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

button:active {
  transform: scale(0.97);
  opacity: 0.85;
}

.blue { background: #007aff; }
.green { background: #22c55e; }
.red { background: #ff3b30; }
.orange { background: #ff9500; }

.section {
  text-align: center;
  font-weight: bold;
  margin: 20px 0 10px;
}
</style>
</head>

<body>
<div class="app">
  <h1>🇻🇳 VND → JPY 🇯🇵</h1>

  <input id="input" inputmode="numeric" placeholder="VNDを入力">

  <div class="result" id="result">約 0 円</div>
  <div class="rate">1円 = 160VND</div>

  <div class="row">
    <button class="red" data-action="clear">Clear</button>
    <button class="orange" data-action="zeros">000</button>
  </div>

  <div class="section">Kなし表記で追加</div>
  <div class="grid">
    <button class="blue" data-add="1000">+1,000</button>
    <button class="blue" data-add="2000">+2,000</button>
    <button class="blue" data-add="5000">+5,000</button>
    <button class="blue" data-add="10000">+10,000</button>
    <button class="blue" data-add="20000">+20,000</button>
    <button class="blue" data-add="50000">+50,000</button>
    <button class="blue" data-add="100000">+100,000</button>
    <button class="blue" data-add="200000">+200,000</button>
    <button class="blue" data-add="500000">+500,000</button>
  </div>

  <div class="section">Kあり表記で追加</div>
  <div class="grid">
    <button class="green" data-add="1000">+1K</button>
    <button class="green" data-add="2000">+2K</button>
    <button class="green" data-add="5000">+5K</button>
    <button class="green" data-add="10000">+10K</button>
    <button class="green" data-add="20000">+20K</button>
    <button class="green" data-add="50000">+50K</button>
    <button class="green" data-add="100000">+100K</button>
    <button class="green" data-add="200000">+200K</button>
    <button class="green" data-add="500000">+500K</button>
  </div>
</div>

<script>
const RATE = 160;
const input = document.getElementById("input");
const result = document.getElementById("result");

input.addEventListener("input", () => {
  setValue(getValue());
});

function getValue() {
  const digits = input.value.replace(/\D/g, "");
  return digits ? Number(digits) : 0;
}

function setValue(value) {
  if (!value) {
    input.value = "";
    result.textContent = "約 0 円";
    return;
  }

  input.value = value.toLocaleString();
  const yen = Math.round(value / RATE);
  result.textContent = "約 " + yen.toLocaleString() + " 円";
}

function addValue(value) {
  setValue(getValue() + value);
}

function addZeros() {
  const digits = input.value.replace(/\D/g, "");
  setValue(Number((digits || "0") + "000"));
}

function clearInput() {
  setValue(0);
}

document.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("touchstart", function(e) {
    e.preventDefault();

    const add = this.dataset.add;
    const action = this.dataset.action;

    if (add) addValue(Number(add));
    if (action === "clear") clearInput();
    if (action === "zeros") addZeros();
  }, { passive: false });
});

// Safari拡大系を抑制
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
